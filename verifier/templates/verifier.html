<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop check — {{ verifier }}</title>
<link rel="manifest" href="/app.webmanifest">
<meta name="theme-color" content="#047857">
<link rel="stylesheet" href="/static/shop.css">
<script src="/static/vendor/qrcode-lib.js" defer></script>
<script src="/static/vendor/scanutil.js" defer></script>
<script src="/static/vendor/scanner.js" defer></script>
</head>
<body>
<h1>Shop check — {{ verifier }}</h1>
<div class="badges" aria-live="polite">
  <span class="badge" id="netBadge">…</span>
  <span class="badge" id="trustBadge">Trust: ?</span>
</div>

<div id="result" role="status" aria-live="assertive">
  <div id="resultIcon" aria-hidden="true"></div>
  <div id="resultWord"></div>
  <div id="resultWhy"></div>
  <p class="muted">Tap to continue</p>
</div>
<p id="msg" aria-live="polite"></p>

<section class="card" aria-label="Scan or paste">
  <h2>1 · Scan the customer's QR</h2>
  <div id="videoWrap" hidden>
    <video id="video" playsinline muted aria-label="Camera viewfinder"></video>
    <div class="row">
      <button id="scanBtn">Start camera</button>
      <button id="torchBtn" hidden>Torch: off</button>
      <button id="switchBtn" hidden>Switch camera</button>
    </div>
    <p class="muted" id="backendNote"></p>
  </div>
  <div id="noCamMsg" class="muted" hidden></div>
  <label>Paste presentation JSON instead
    <textarea id="credInput" placeholder='{"c":{…},"p":{…}}' spellcheck="false"></textarea>
  </label>
  <div class="row"><button class="primary" id="verifyBtn">Check ID</button></div>
</section>

<section class="card" aria-label="Challenge">
  <h2>2 · Challenge <span class="muted">(customer scans it — stops copied QRs)</span></h2>
  <div class="challengeRow">
    <canvas id="challengeQR" width="132" height="132" role="img" aria-label="Challenge QR code"></canvas>
    <div>
      <p class="tight">Code: <code class="mono" id="nonce">…</code></p>
      <div class="row"><button id="nonceBtn">New challenge</button></div>
    </div>
  </div>
</section>

<section class="card" aria-label="Recent checks">
  <h2>Recent checks <span class="muted">(no personal data kept)</span></h2>
  <table><thead><tr><th>Time</th><th>Result</th><th>Mode</th></tr></thead>
  <tbody id="recentBody"><tr><td colspan="3" class="muted">None yet.</td></tr></tbody></table>
</section>

<details class="card" id="adminDrawer">
  <summary>Shop admin (receipts + pairing)</summary>
  <label>Admin token (kept in memory only)
    <input id="adminToken" type="password" autocomplete="off" class="wide">
  </label>
  <div class="row">
    <button id="receiptsBtn">View receipts</button>
    <button id="csvBtn">Export CSV</button>
  </div>
  <div id="adminReceipts"></div>
  <label>Pair with a signed bundle (paste JSON)
    <textarea id="bundleInput" placeholder='{"v":…,"s":…}' spellcheck="false"></textarea>
  </label>
  <div class="row"><button id="syncBtn">Sync bundle</button></div>
</details>

<p class="muted"><a href="/receipts.csv">CSV</a> · <a href="/healthz">Health</a> · <a href="/status">Status</a></p>
<script src="/static/shop.js"></script>
</body>
</html>
