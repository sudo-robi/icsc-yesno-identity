# Render blueprint WITH a persistent disk (paid instance required for disks).
# Free tier has no disk: SQLite/keys/receipts reset on redeploy (re-pair after).
# 1. Push to GitHub
# 2. Render → New → Blueprint → select this repo
# 3. Set ADMIN_TOKEN in the Render dashboard (Environment tab)
# 4. After both services boot, pair the shop:
#    curl -sf https://yn-issuer.onrender.com/bundle?vid=SHOP-A | \
#      curl -sf -X POST https://yn-verifier.onrender.com/sync \
#        -H "Content-Type: application/json" \
#        -H "Authorization: Bearer $ADMIN_TOKEN" -d @-
services:
  - type: web
    name: yn-issuer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn issuer.app:app --bind 0.0.0.0:$PORT --workers 1
    disk:
      name: issuer-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ISSUER_DB
        value: /data/issuer.db
      - key: ISSUER_KEYDIR
        value: /data/keys
      - key: OTP_SECRETS_PATH
        value: /data/otp_secrets.json
      - key: ADMIN_TOKEN
        sync: false
      - key: BEHIND_PROXY
        value: 1
  - type: web
    name: yn-verifier
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn verifier.app:app --bind 0.0.0.0:$PORT --workers 1
    disk:
      name: verifier-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: VERIFIER_DB
        value: /data/receipts.db
      - key: OTP_SECRETS_PATH
        value: /data/otp_secrets.json
      - key: ADMIN_TOKEN
        sync: false
      - key: BEHIND_PROXY
        value: 1
