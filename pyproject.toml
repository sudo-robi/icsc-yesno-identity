[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "icsc-yesno-identity"
version = "1.0.0"
description = "Yes/No Identity - Offline Age Verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.0.3",
    "cryptography==42.0.5",
    "marshmallow==3.21.3",
    "Flask-Limiter==3.8.0",
    "gunicorn==22.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
    "ruff==0.5.5",
    "playwright==1.40.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
coverage = {source = ["shared", "issuer", "verifier"]}

[tool.ruff]
line-length = 100
target-version = "py311"